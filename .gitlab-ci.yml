image: docker:latest
services:
  - docker:dind
variables:
  APP_NAME: produlab-api
  APP_VERSION: 0.0.1
  CONTAINER_RELEASE_IMAGE: registry.gitlab.com/marcelorubim/prodlab
release:
  tags:
    - docker
  stage: build
  script:
    - docker build -t $CONTAINER_RELEASE_IMAGE .
    - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN registry.gitlab.com
    - docker push $CONTAINER_RELEASE_IMAGE
  only:
    - master
build2:
  tags:
    - docker
  stage: build
  script:
    - docker build -t $CONTAINER_RELEASE_IMAGE:$CI_COMMIT_TAG .
    - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN registry.gitlab.com
    - docker push $CONTAINER_RELEASE_IMAGE:$CI_COMMIT_TAG
  only:
    - tags