version: '3'
services:
  mysql:
    image: mysql:8
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    ports:
    - "3306:3306"
    environment:
    - MYSQL_DATABASE=prodlab
    - MYSQL_USER=${DB_USER:-prodlab}
    - MYSQL_PASSWORD=${DB_PASSWORD:-CHANGE_ME}
    - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-CHANGE_ME}
    volumes: 
    #- prodlabdata:/var/lib/mysql
    - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-CHANGE_ME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ghcr.io/marcelorubim/produlabs:latest
    ports:
    - "8080:8080"
    environment:
    - DB_USERNAME=${DB_USER:-prodlab}
    - DB_PASSWORD=${DB_PASSWORD:-CHANGE_ME}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  prodlabdata: